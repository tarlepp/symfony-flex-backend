name: Update Docker image pins
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-image-updates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  php-minor-readiness:
    name: Check PHP minor upgrade readiness
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      report: ${{ steps.readiness-report.outputs.report }}
      summary-outcome: ${{ steps.readiness-report.outcome }}
    steps:
      - name: Harden the readiness runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the selected branch for PHP readiness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Check the next PHP minor against locked platform requirements
        id: php-minor
        shell: bash
        run: |
          GITHUB_STEP_SUMMARY="$RUNNER_TEMP/php-minor-readiness.md" \
            bash scripts/docker/docker-images.sh check-php-minor --prepare 2>&1 |
            tee "$RUNNER_TEMP/php-minor-readiness.log"

      - name: Publish PHP readiness evidence
        id: readiness-report
        if: ${{ !cancelled() && steps.php-minor.outcome != 'skipped' }}
        env:
          CHECK_OUTCOME: ${{ steps.php-minor.outcome }}
        run: |
          python3 scripts/docker/php-minor-readiness-report.py \
            --source "$RUNNER_TEMP/php-minor-readiness.md" \
            --log "$RUNNER_TEMP/php-minor-readiness.log" --outcome "$CHECK_OUTCOME"

      - name: Track confirmed PHP minor blockers
        id: minor-issues
        if: ${{ steps.php-minor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          CHECK_OUTCOME: ${{ steps.php-minor.outcome }}
          PHP_READINESS_REPORT: ${{ steps.readiness-report.outputs.report }}
        run: |
          python3 scripts/docker/php-minor-issues.py \
            --source "$RUNNER_TEMP/php-minor-readiness.md" \
            --log "$RUNNER_TEMP/php-minor-readiness.log" --outcome "$CHECK_OUTCOME"

      - name: Select PHP minor PR authentication
        id: minor-auth
        if: ${{ steps.php-minor.outputs.prepared == 'true' }}
        env: &maintenance_pr_credentials
          APP_CLIENT_ID: ${{ vars.DOCKER_IMAGE_UPDATE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DOCKER_IMAGE_UPDATE_APP_PRIVATE_KEY }}
          UPDATE_TOKEN: ${{ secrets.DOCKER_IMAGE_UPDATE_TOKEN }}
        run: bash scripts/docker/select-maintenance-pr-auth.sh php-minor

      - name: Prepare PHP minor PR details
        id: minor-details
        if: ${{ steps.minor-auth.outputs.method != '' }}
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          PHP_CANDIDATE: ${{ steps.php-minor.outputs.candidate }}
          PHP_READINESS_REPORT: ${{ steps.readiness-report.outputs.report }}
          PHP_CLOSING_ISSUES: ${{ steps.minor-issues.outputs.closing-issues }}
        run: bash scripts/docker/prepare-php-minor-pr.sh

      - name: Create repository-scoped GitHub App token for PHP migration
        id: minor-token
        if: ${{ steps.minor-auth.outputs.method == 'app' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCKER_IMAGE_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCKER_IMAGE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update the PHP minor pull request
        id: minor-pr
        if: ${{ steps.minor-details.outcome == 'success' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.minor-token.outputs.token || secrets.DOCKER_IMAGE_UPDATE_TOKEN }}
          base: ${{ github.ref_name }}
          branch: ${{ steps.minor-details.outputs.branch }}
          add-paths: |
            Dockerfile
            composer.json
            composer.lock
            tools/*/composer.json
            tools/*/composer.lock
          commit-message: |
            Chore(docker): Update PHP to ${{ steps.php-minor.outputs.candidate }}

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: Chore(docker) - Update PHP to ${{ steps.php-minor.outputs.candidate }}
          body-path: ${{ runner.temp }}/php-minor-pr.md

      - name: Publish PHP minor PR outcome
        if: ${{ !cancelled() && steps.php-minor.outputs.prepared == 'true' }}
        continue-on-error: true
        env:
          PR_OUTCOME: ${{ steps.minor-pr.outcome }}
          PR_URL: ${{ steps.minor-pr.outputs.pull-request-url }}
        run: |
          if [ "$PR_OUTCOME" = success ] && [ -n "$PR_URL" ]; then
            printf '\nPHP minor migration PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PR_OUTCOME" = success ]; then
            printf '\nNo PHP minor PR changes.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNo PHP minor PR was confirmed (PR step: %s).\n' "$PR_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          fi

  update:
    name: Update Docker image versions and digests
    needs: php-minor-readiness
    if: ${{ !cancelled() && github.ref_type == 'branch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Make checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Authenticate to Docker Hub when credentials are available
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/ci/ci-docker-hub-auth.sh 'Using anonymous Docker Hub requests (rate limits apply).'

      - name: Bootstrap maintenance container
        id: bootstrap
        uses: ./.github/actions/php-bootstrap
        with:
          build-target: maintenance
          install-dependencies: 'false'
          print-versions: 'false'

      - name: Run Docker image helper regression tests
        id: tests
        run: bash scripts/make/make.sh test-docker-images

      - name: Apply minor/patch updates and digest refreshes
        id: update
        run: bash scripts/make/make.sh docker-image-update-pins

      - name: Verify updated multi-platform pins and tag parity
        id: verify
        run: bash scripts/make/make.sh docker-image-verify-pins

      - name: Synchronize Composer with the PHP image
        id: composer
        shell: bash
        run: |
          git show HEAD:Dockerfile |
            docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T \
              -e COMPOSER_HOME=/tmp/composer php bash scripts/sync-composer-php.sh

      - name: Synchronize Doctrine with the MariaDB image
        id: doctrine
        shell: bash
        run: bash scripts/docker/sync-doctrine-mariadb.sh

      - name: Synchronize CI MariaDB image pin
        id: ci-mariadb
        shell: bash
        run: bash scripts/docker/sync-ci-mariadb.sh

      - name: Prepare pull request details
        id: details
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          PHP_READINESS_REPORT: ${{ needs.php-minor-readiness.outputs.report }}
          PHP_READINESS_RESULT: ${{ needs.php-minor-readiness.result }}
        run: bash scripts/docker/prepare-image-update-pr.sh

      - name: Select pull request authentication
        id: authentication
        env: *maintenance_pr_credentials
        run: bash scripts/docker/select-maintenance-pr-auth.sh image-update

      - name: Create repository-scoped GitHub App token
        id: app-token
        if: ${{ steps.authentication.outputs.app == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCKER_IMAGE_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCKER_IMAGE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create or update the Docker image pull request
        id: pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token || secrets.DOCKER_IMAGE_UPDATE_TOKEN || github.token }}
          base: ${{ github.ref_name }}
          branch: ${{ steps.details.outputs.branch }}
          add-paths: |
            Dockerfile
            docker/*/Dockerfile*
            composer.json
            composer.lock
            config/packages/doctrine.yaml
            .github/workflows/main.yml
            tools/*/composer.json
            tools/*/composer.lock
          commit-message: |
            Chore(docker): update image versions and digest pins

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: Chore(docker) - Update image versions and digest pins
          body-path: ${{ runner.temp }}/docker-image-pr.md

      - name: Diagnose PHP container failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash scripts/ci/ci-failure-diagnostics.sh

      - name: Log out of Docker Hub
        if: ${{ always() }}
        run: docker logout docker.io

      - name: Stop PHP development container
        if: ${{ always() }}
        run: bash scripts/make/make.sh ci-stop

      - name: Publish workflow run overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Docker image pin maintenance
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BASE_BRANCH: ${{ github.ref_name }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          TESTS: ${{ steps.tests.outcome || 'skipped' }}
          UPDATE: ${{ steps.update.outcome || 'skipped' }}
          VERIFY: ${{ steps.verify.outcome || 'skipped' }}
          COMPOSER: ${{ steps.composer.outcome || 'skipped' }}
          DOCTRINE: ${{ steps.doctrine.outcome || 'skipped' }}
          CI_MARIADB: ${{ steps.ci-mariadb.outcome || 'skipped' }}
          DETAILS: ${{ steps.details.outcome || 'skipped' }}
          PULL_REQUEST: ${{ steps.pull-request.outcome || 'skipped' }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pull-request.outputs.pull-request-operation }}
          PHP_READINESS_SUMMARY: ${{ needs.php-minor-readiness.outputs.summary-outcome }}
          PHP_READINESS_RESULT: ${{ needs.php-minor-readiness.result }}
        run: |
          {
            if [ "$PHP_READINESS_SUMMARY" = success ]; then
              printf 'PHP minor readiness evidence is in the **Check PHP minor upgrade readiness** job summary (job result: %s).\n\n' "$PHP_READINESS_RESULT"
            else
              printf '## PHP minor upgrade readiness\n\n> [!WARNING]\n> PHP minor readiness summary was not confirmed; routine image updates remain separate.\n\n**Result: Unavailable**\n\nReason: Readiness summary publication did not succeed (summary step: %s; readiness job: %s). No compatibility conclusion can be drawn; see the readiness job logs.\n\n' "${PHP_READINESS_SUMMARY:-unavailable}" "$PHP_READINESS_RESULT"
            fi
            bash scripts/ci/ci-workflow-overview.sh \
              "Core CI's Docker image version report lists major upgrades for manual review." \
              'Maintenance container' "$BOOTSTRAP" \
              'Helper regression tests' "$TESTS" \
              'Image pin updates' "$UPDATE" \
              'Pin verification' "$VERIFY" \
              'Composer synchronization' "$COMPOSER" \
              'Doctrine synchronization' "$DOCTRINE" \
              'CI MariaDB synchronization' "$CI_MARIADB" \
              'Change report preparation' "$DETAILS" \
              'Pull request action' "$PULL_REQUEST"

            printf "\n## Pull request\n\nBase branch: \`%s\`\n\n" "$BASE_BRANCH"
            if [ "$PULL_REQUEST" != success ]; then
              printf 'No confirmed pull request result (action outcome: %s).\n' "$PULL_REQUEST"
            elif [ -n "$PR_URL" ]; then
              printf 'Docker image update PR (%s): %s\n' "${PR_OPERATION:-unchanged}" "$PR_URL"
            elif [ -n "$PR_OPERATION" ] && [ "$PR_OPERATION" != none ]; then
              printf 'Pull request action reported: %s.\n' "$PR_OPERATION"
            else
              echo 'No pull request changes.'
            fi

            printf '\n'
            if [ "$DETAILS" = success ]; then
              cat "$RUNNER_TEMP/docker-image-changes.md"
            else
              echo 'No verified change report was prepared. See the step outcomes and logs above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
