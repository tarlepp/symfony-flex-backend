name: Update Docker image pins
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-image-updates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  php-minor-readiness:
    name: Check PHP minor upgrade readiness
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      report: ${{ steps.readiness-report.outputs.report }}
      actions-report: ${{ steps.readiness-report.outputs.actions-report }}
    steps:
      - name: Harden the readiness runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the selected branch for PHP readiness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Check the next PHP minor against locked platform requirements
        id: php-minor
        shell: bash
        run: |
          GITHUB_STEP_SUMMARY="$RUNNER_TEMP/php-minor-readiness.md" \
            bash scripts/docker/docker-images.sh check-php-minor --prepare 2>&1 |
            tee "$RUNNER_TEMP/php-minor-readiness.log"

      - name: Publish PHP readiness evidence
        id: readiness-report
        if: ${{ !cancelled() && steps.php-minor.outcome != 'skipped' }}
        env:
          CHECK_OUTCOME: ${{ steps.php-minor.outcome }}
        run: |
          python3 scripts/docker/php-minor-readiness-report.py \
            --source "$RUNNER_TEMP/php-minor-readiness.md" \
            --log "$RUNNER_TEMP/php-minor-readiness.log" --outcome "$CHECK_OUTCOME"

      - name: Track confirmed PHP minor blockers
        id: minor-issues
        if: ${{ steps.php-minor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          CHECK_OUTCOME: ${{ steps.php-minor.outcome }}
          PHP_READINESS_REPORT: ${{ steps.readiness-report.outputs.report }}
        run: |
          python3 scripts/docker/php-minor-issues.py \
            --source "$RUNNER_TEMP/php-minor-readiness.md" \
            --log "$RUNNER_TEMP/php-minor-readiness.log" --outcome "$CHECK_OUTCOME"

      - name: Select PHP minor PR authentication
        id: minor-auth
        if: ${{ steps.php-minor.outputs.prepared == 'true' }}
        env: &maintenance_pr_credentials
          APP_CLIENT_ID: ${{ vars.DOCKER_IMAGE_UPDATE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DOCKER_IMAGE_UPDATE_APP_PRIVATE_KEY }}
          UPDATE_TOKEN: ${{ secrets.DOCKER_IMAGE_UPDATE_TOKEN }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'method=app' >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_CLIENT_ID" ] || [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'No PHP migration PR: configure both Docker image update App credentials, or neither.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ -n "$UPDATE_TOKEN" ]; then
            echo 'method=pat' >> "$GITHUB_OUTPUT"
          else
            echo 'No PHP migration PR: configure the Docker image update App or PAT so that the PR triggers CI.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare PHP minor PR details
        id: minor-details
        if: ${{ steps.minor-auth.outputs.method != '' }}
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          PHP_CANDIDATE: ${{ steps.php-minor.outputs.candidate }}
          PHP_READINESS_REPORT: ${{ steps.readiness-report.outputs.report }}
          PHP_CLOSING_ISSUES: ${{ steps.minor-issues.outputs.closing-issues }}
        run: |
          branch_id=$(printf '%s' "$BASE_BRANCH" | sha256sum | cut -c1-16)
          printf 'branch=chore(docker)/php-minor-%s\n' "$branch_id" >> "$GITHUB_OUTPUT"
          sed \
            -e "s|^\* Describe the change$|* Update PHP to \`${PHP_CANDIDATE}\` and align the root and tool Composer baselines.|" \
            -e 's|^\* Explain why it is needed$|* Adopt the next compatible PHP minor without upgrading locked packages.|' \
            .github/pull_request_template.md > "$RUNNER_TEMP/php-minor-pr.md"
          cat >> "$RUNNER_TEMP/php-minor-pr.md" << 'EOF'

          ## Automated readiness evidence

          * `bash scripts/docker/docker-images.sh check-php-minor --prepare` passed:
            verified PHP pin, development build, Composer lockfile platform checks,
            and lockfile refresh and validation with unchanged package versions and references.
          * Application tests and the production build were not run before opening
            this PR. Normal PR CI must pass before merging.
          EOF
          printf '\n%s\n' "$PHP_READINESS_REPORT" >> "$RUNNER_TEMP/php-minor-pr.md"
          if [ -n "$PHP_CLOSING_ISSUES" ]; then
            printf '\n%s\n' "$PHP_CLOSING_ISSUES" >> "$RUNNER_TEMP/php-minor-pr.md"
          fi

      - name: Create repository-scoped GitHub App token for PHP migration
        id: minor-token
        if: ${{ steps.minor-auth.outputs.method == 'app' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCKER_IMAGE_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCKER_IMAGE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update the PHP minor pull request
        id: minor-pr
        if: ${{ steps.minor-details.outcome == 'success' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.minor-token.outputs.token || secrets.DOCKER_IMAGE_UPDATE_TOKEN }}
          base: ${{ github.ref_name }}
          branch: ${{ steps.minor-details.outputs.branch }}
          add-paths: |
            Dockerfile
            composer.json
            composer.lock
            tools/*/composer.json
            tools/*/composer.lock
          commit-message: |
            Chore(docker): Update PHP to ${{ steps.php-minor.outputs.candidate }}

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: Chore(docker) - Update PHP to ${{ steps.php-minor.outputs.candidate }}
          body-path: ${{ runner.temp }}/php-minor-pr.md

      - name: Publish PHP minor PR outcome
        if: ${{ !cancelled() && steps.php-minor.outputs.prepared == 'true' }}
        continue-on-error: true
        env:
          PR_OUTCOME: ${{ steps.minor-pr.outcome }}
          PR_URL: ${{ steps.minor-pr.outputs.pull-request-url }}
        run: |
          if [ "$PR_OUTCOME" = success ] && [ -n "$PR_URL" ]; then
            printf '\nPHP minor migration PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PR_OUTCOME" = success ]; then
            printf '\nNo PHP minor PR changes.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNo PHP minor PR was confirmed (PR step: %s).\n' "$PR_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          fi

  update:
    name: Update Docker image versions and digests
    needs: php-minor-readiness
    if: ${{ !cancelled() && github.ref_type == 'branch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Make checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Authenticate to Docker Hub when credentials are available
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          elif [ -n "$DOCKERHUB_USERNAME" ] || [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, or neither."
            exit 1
          else
            echo "::notice::Using anonymous Docker Hub requests (rate limits apply)."
          fi

      - name: Bootstrap maintenance container
        id: bootstrap
        uses: ./.github/actions/php-bootstrap
        with:
          build-target: maintenance
          install-dependencies: 'false'
          print-versions: 'false'

      - name: Run Docker image helper regression tests
        id: tests
        run: bash scripts/make/make.sh test-docker-images

      - name: Apply minor/patch updates and digest refreshes
        id: update
        run: bash scripts/make/make.sh docker-image-update-pins

      - name: Verify updated multi-platform pins and tag parity
        id: verify
        run: bash scripts/make/make.sh docker-image-verify-pins

      - name: Synchronize Composer with the PHP image
        id: composer
        shell: bash
        run: |
          git show HEAD:Dockerfile |
            docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T \
              -e COMPOSER_HOME=/tmp/composer php bash scripts/sync-composer-php.sh

      - name: Synchronize Doctrine with the MariaDB image
        id: doctrine
        shell: bash
        run: |
          dockerfile=docker/mariadb/Dockerfile
          directive='s/^FROM mariadb:([0-9]+\.[0-9]+\.[0-9]+)@sha256:[a-f0-9]{64}$/\1/p'
          previous=$(git show "HEAD:$dockerfile" | sed -nE "$directive")
          candidate=$(sed -nE "$directive" "$dockerfile")
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$previous" =~ $version_pattern && "$candidate" =~ $version_pattern ]]; then
            echo '::error::Expected exactly one pinned MariaDB version in each Dockerfile.'
            exit 1
          fi
          if [[ "$previous" == "$candidate" ]]; then
            echo "MariaDB tag unchanged ($candidate); no Doctrine update needed."
            exit 0
          fi
          if [[ "${previous%%.*}" != "${candidate%%.*}" ]]; then
            echo '::error::MariaDB major upgrades require manual review.'
            exit 1
          fi
          config=config/packages/doctrine.yaml
          if [[ $(grep -Ec '^[[:space:]]*server_version:' "$config") != 1 ]] ||
            ! grep -Eq "^        server_version: 'mariadb-[0-9]+\.[0-9]+\.[0-9]+'$" "$config"; then
            echo '::error::Expected exactly one explicit MariaDB server_version in Doctrine configuration.'
            exit 1
          fi
          sed -i -E "s/^(        server_version: )'mariadb-[0-9]+\.[0-9]+\.[0-9]+'$/\1'mariadb-$candidate'/" "$config"
          echo "Doctrine server_version synchronized to mariadb-$candidate."

      - name: Synchronize CI MariaDB image pin
        id: ci-mariadb
        shell: bash
        run: |
          dockerfile=docker/mariadb/Dockerfile
          workflow=.github/workflows/main.yml
          pin=$(sed -nE 's/^FROM (mariadb:[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64})$/\1/p' "$dockerfile")
          if ! [[ "$pin" =~ ^mariadb:[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Expected exactly one pinned MariaDB image in the Dockerfile.'
            exit 1
          fi
          if [[ $(grep -Ec '^[[:space:]]*image:[[:space:]]*mariadb:' "$workflow") != 1 ]] ||
            ! grep -Eq '^        image: mariadb:[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$' "$workflow"; then
            echo '::error::Expected exactly one pinned MariaDB service image in the CI workflow.'
            exit 1
          fi
          sed -i -E "s|^(        image: )mariadb:[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$|\1${pin}|" "$workflow"
          echo "CI MariaDB service synchronized to $pin."

      - name: Prepare pull request details
        id: details
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          PHP_READINESS_REPORT: ${{ needs.php-minor-readiness.outputs.report }}
          PHP_READINESS_RESULT: ${{ needs.php-minor-readiness.result }}
        run: |
          branch_id=$(printf '%s' "$BASE_BRANCH" | sha256sum | cut -c1-16)
          echo "branch=chore(docker)/image-updates-${branch_id}" >> "$GITHUB_OUTPUT"

          python3 scripts/docker/docker-image-digest-summary.py > "$RUNNER_TEMP/docker-image-digests.md"
          stat=$(git diff --no-ext-diff --stat=160,120 -- Dockerfile 'docker/*/Dockerfile*' \
            composer.json composer.lock 'tools/*/composer.json' 'tools/*/composer.lock' config/packages/doctrine.yaml .github/workflows/main.yml)
          # The PR action can restore the working tree; capture the verified changes first.
          {
            printf '## Proposed changes\n\n'
            if [ -n "$stat" ]; then
              printf '%s\n%s\n%s\n\n' '```text' "$stat" '```'
              printf '### Image pins and Doctrine server version\n\n%s\n' '```diff'
              git diff --no-ext-diff --unified=0 -- Dockerfile 'docker/*/Dockerfile*' config/packages/doctrine.yaml .github/workflows/main.yml
              printf '%s\n' '```'
            else
              echo 'No eligible tag or digest changes.'
            fi
            printf '\n'
            cat "$RUNNER_TEMP/docker-image-digests.md"
          } > "$RUNNER_TEMP/docker-image-changes.md"

          sed \
            -e 's|^\* Describe the change$|* Refresh Docker image pins with available stable minor/patch versions or digest-only updates, without changing their major versions; floating tags receive digest refreshes only.|' \
            -e 's|^\* Explain why it is needed$|* Keep image pins aligned with upstream while preserving variants and supported platforms. Major-version upgrades remain a manual review.|' \
            .github/pull_request_template.md > "$RUNNER_TEMP/docker-image-pr.md"

          {
          cat << 'EOF'

          ## Automated update details

          PHP is limited to patch updates. When its tag changes, the root and tool
          Composer requirements, platform settings and lockfiles are synchronized
          without upgrading packages. Doctrine's configured server version is
          synchronized when the MariaDB tag changes. The CI MariaDB service pin
          is synchronized with the Dockerfile, including digest-only updates.
          EOF
          if [ -n "$PHP_READINESS_REPORT" ]; then
            printf '\n%s\n' "$PHP_READINESS_REPORT"
          else
            printf '\n## PHP minor upgrade readiness\n\n**Result: Unavailable**\n\nReason: No readiness evidence was received (readiness job: %s). No compatibility conclusion can be drawn; see the readiness job logs.\n' "$PHP_READINESS_RESULT"
          fi
          cat "$RUNNER_TEMP/docker-image-digests.md"
          cat << 'EOF'

          ## Dockerfile and CI image changes

          The diff lists each changed Dockerfile and the exact old and new image
          references, including the CI MariaDB service:

          ```diff
          EOF
          git diff --no-ext-diff --unified=0 -- Dockerfile 'docker/*/Dockerfile*' .github/workflows/main.yml
          cat << 'EOF'
          ```

          ## Automated validation evidence

          * `bash scripts/make/make.sh test-docker-images` — passed (offline regression tests).
          * `bash scripts/make/make.sh docker-image-update-pins` — passed (live registry resolution).
          * `bash scripts/make/make.sh docker-image-verify-pins` — passed (live pin verification).
          * Composer PHP synchronization and lockfile validation passed when the PHP tag changed.
          * Doctrine server version synchronization passed when the MariaDB tag changed.
          * CI MariaDB service pin synchronization passed.
          * Application tests and builds are not run by this Docker maintenance workflow.
          EOF
          } >> "$RUNNER_TEMP/docker-image-pr.md"

      - name: Select pull request authentication
        id: authentication
        env: *maintenance_pr_credentials
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_CLIENT_ID" ] || [ -n "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure both DOCKER_IMAGE_UPDATE_APP_CLIENT_ID and DOCKER_IMAGE_UPDATE_APP_PRIVATE_KEY, or neither."
            exit 1
          elif [ -n "$UPDATE_TOKEN" ]; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Using GITHUB_TOKEN: generated PRs will not trigger CI. Configure the update App or PAT, or close and reopen the PR as a maintainer before merging."
            echo "Warning: GITHUB_TOKEN fallback does not trigger PR CI; maintainer action is required." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create repository-scoped GitHub App token
        id: app-token
        if: ${{ steps.authentication.outputs.app == 'true' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCKER_IMAGE_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCKER_IMAGE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create or update the Docker image pull request
        id: pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token || secrets.DOCKER_IMAGE_UPDATE_TOKEN || github.token }}
          base: ${{ github.ref_name }}
          branch: ${{ steps.details.outputs.branch }}
          add-paths: |
            Dockerfile
            docker/*/Dockerfile*
            composer.json
            composer.lock
            config/packages/doctrine.yaml
            .github/workflows/main.yml
            tools/*/composer.json
            tools/*/composer.lock
          commit-message: |
            Chore(docker): update image versions and digest pins

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: Chore(docker) - Update image versions and digest pins
          body-path: ${{ runner.temp }}/docker-image-pr.md

      - name: Diagnose PHP container failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash scripts/ci/ci-failure-diagnostics.sh

      - name: Log out of Docker Hub
        if: ${{ always() }}
        run: docker logout docker.io

      - name: Stop PHP development container
        if: ${{ always() }}
        run: bash scripts/make/make.sh ci-stop

      - name: Publish workflow run overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BASE_BRANCH: ${{ github.ref_name }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          TESTS: ${{ steps.tests.outcome || 'skipped' }}
          UPDATE: ${{ steps.update.outcome || 'skipped' }}
          VERIFY: ${{ steps.verify.outcome || 'skipped' }}
          COMPOSER: ${{ steps.composer.outcome || 'skipped' }}
          DOCTRINE: ${{ steps.doctrine.outcome || 'skipped' }}
          CI_MARIADB: ${{ steps.ci-mariadb.outcome || 'skipped' }}
          DETAILS: ${{ steps.details.outcome || 'skipped' }}
          PULL_REQUEST: ${{ steps.pull-request.outcome || 'skipped' }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pull-request.outputs.pull-request-operation }}
          PHP_READINESS_ACTIONS: ${{ needs.php-minor-readiness.outputs.actions-report }}
          PHP_READINESS_RESULT: ${{ needs.php-minor-readiness.result }}
        run: |
          {
            if [ -n "$PHP_READINESS_ACTIONS" ]; then
              printf '%s\n\n' "$PHP_READINESS_ACTIONS"
            else
              printf '## PHP minor upgrade readiness\n\n> [!WARNING]\n> PHP minor upgrade needs attention; routine image updates remain separate.\n\n**Result: Unavailable**\n\nReason: No readiness evidence was received (readiness job: %s). No compatibility conclusion can be drawn; see the readiness job logs.\n\n' "$PHP_READINESS_RESULT"
            fi
            bash scripts/ci/ci-workflow-overview.sh \
              "Core CI's Docker image version report lists major upgrades for manual review." \
              'Maintenance container' "$BOOTSTRAP" \
              'Helper regression tests' "$TESTS" \
              'Image pin updates' "$UPDATE" \
              'Pin verification' "$VERIFY" \
              'Composer synchronization' "$COMPOSER" \
              'Doctrine synchronization' "$DOCTRINE" \
              'CI MariaDB synchronization' "$CI_MARIADB" \
              'Change report preparation' "$DETAILS" \
              'Pull request action' "$PULL_REQUEST"

            printf "\n## Pull request\n\nBase branch: \`%s\`\n\n" "$BASE_BRANCH"
            if [ "$PULL_REQUEST" != success ]; then
              printf 'No confirmed pull request result (action outcome: %s).\n' "$PULL_REQUEST"
            elif [ -n "$PR_URL" ]; then
              printf 'Docker image update PR (%s): %s\n' "${PR_OPERATION:-unchanged}" "$PR_URL"
            elif [ -n "$PR_OPERATION" ] && [ "$PR_OPERATION" != none ]; then
              printf 'Pull request action reported: %s.\n' "$PR_OPERATION"
            else
              echo 'No pull request changes.'
            fi

            printf '\n'
            if [ "$DETAILS" = success ]; then
              cat "$RUNNER_TEMP/docker-image-changes.md"
            else
              echo 'No verified change report was prepared. See the step outcomes and logs above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
