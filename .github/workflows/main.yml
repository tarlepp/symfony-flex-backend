# GitHub Actions docs
# https://help.github.com/en/articles/about-github-actions
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
name: CI
on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:
    types:
      - checks_requested
  schedule:
    # Periodic checks only: dependency advisories and Docker image updates.
    # Production and development image scans run in vulnerability-scan.yml.
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Metadata-only edits must not cancel validation of the unchanged PR commit.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && '-metadata' || '' }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      markdown: ${{ steps.detect.outputs.markdown }}
      documentation: ${{ steps.detect.outputs.documentation }}
      configuration: ${{ steps.detect.outputs.configuration }}
      runtime: ${{ steps.detect.outputs.runtime }}
      composer: ${{ steps.detect.outputs.composer }}
      yaml: ${{ steps.detect.outputs.yaml }}
      compose: ${{ steps.detect.outputs.compose }}
      tooling: ${{ steps.detect.outputs.tooling }}
      workflows: ${{ steps.detect.outputs.workflows }}
      security: ${{ steps.detect.outputs.security }}
      images: ${{ steps.detect.outputs.images }}
      php: ${{ steps.detect.outputs.php }}
      tests: ${{ steps.detect.outputs.tests }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - &harden_runner_step
        name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - &checkout_step
        name: Make checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false

      - name: Detect affected validation
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          # Unknown/empty comparisons and manual runs retain full validation.
          code=true
          names=(markdown documentation runtime composer yaml compose tooling workflows security images php tests docker)
          declare -A checks
          enable() {
            local check
            for check in "$@"; do checks["$check"]=true; done
          }
          enable "${names[@]}"
          comparison="$BASE_SHA..$HEAD_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            comparison="$BASE_SHA...$HEAD_SHA"
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            if files=$(git diff --no-renames --name-only "$comparison") && [ -n "$files" ]; then
              echo "Changed files:"
              echo "$files"
              if [ "$EVENT_NAME" = "pull_request" ] && ! grep -qvE '\.md$' <<< "$files"; then
                code=false
              fi
              # Quoted Git paths (including embedded newlines) stay fail-safe.
              if ! grep -q '^"' <<< "$files"; then
                for check in "${names[@]}"; do checks["$check"]=false; done
                while IFS= read -r file; do
                  case "$file" in
                    *.md) enable markdown documentation ;;
                    .markdownlint*|*/.markdownlint*|scripts/markdown-output.sh)
                      enable markdown documentation tooling ;;
                    scripts/check-skills.py) enable documentation ;;
                    doc/*|LICENSE) enable documentation ;;
                    # These inputs can change any runner, command or job contract.
                    Makefile|Dockerfile|.dockerignore|.github/workflows/main.yml|.github/actions/*|scripts/make.sh|scripts/command-output.sh|scripts/native-output.*|scripts/report-output.sh|scripts/command-progress.py|scripts/compose-context.sh)
                      enable "${names[@]}" ;;
                    composer.json|composer.lock|symfony.lock)
                      enable composer runtime yaml php tests docker security ;;
                    phpunit*.xml*|infection.json*|tools/05_infection/*|tools/06_php-coveralls/*|tools/08_phpmetrics/*|scripts/prepare-sonar-reports.sh|sonar-project.properties)
                      enable php tests ;;
                    ecs.php|.php-cs-fixer*|.phplint*|phpstan*|psalm*|phpinsights*|.phpinsights*|phpmd*|.phan/*|rector.php)
                      enable php ;;
                    tools/*/composer.json|tools/*/composer.lock)
                      enable php security ;;
                    src/*|migrations/*|bin/*|public/*|templates/*|translations/*|secrets/*)
                      enable runtime php tests docker ;;
                    config/*)
                      enable runtime php tests docker
                      case "$file" in *.yaml|*.yml) enable yaml ;; esac ;;
                    tests/*) enable php tests ;;
                    *.php) enable runtime php tests docker ;;
                    .env*|docker-entrypoint*.sh|docker/php/*|docker/mariadb/*)
                      enable runtime php tests compose docker
                      case "$file" in *Dockerfile*) enable images ;; esac ;;
                    compose*.yaml|docker/ci-compose.yaml)
                      enable runtime php tests compose docker ;;
                    docker-sync.yml) enable compose tooling ;;
                    docker/*|.devcontainer/*)
                      enable compose docker tooling
                      case "$file" in *Dockerfile*) enable images ;; esac ;;
                    .github/workflows/*|.github/zizmor.yml|scripts/lint-workflows.sh|scripts/check-composer-cache.sh|scripts/tests/ci-gates-test.py|scripts/tests/analyzer-workflow-test.py|scripts/tests/composer-cache-test.py)
                      enable workflows ;;
                    scripts/docker-images.sh|scripts/tests/docker-images-test.sh)
                      enable images ;;
                    scripts/check-security.sh) enable security tooling ;;
                    scripts/*) enable tooling ;;
                    .github/*|.idea/*|.editorconfig|.gitattributes|.gitignore|.pre-commit-config.yaml|.codeclimate.yml)
                      enable tooling ;;
                    *) echo "Unclassified path: $file; retaining full validation"
                      enable "${names[@]}" ;;
                  esac
                  # Tool locks include audit inputs even for report/test tools.
                  case "$file" in tools/*/composer.json|tools/*/composer.lock) enable security ;; esac
                done <<< "$files"
                # Deleted/renamed non-Markdown targets can break existing links.
                if deleted=$(git diff --no-renames --name-only --diff-filter=D "$comparison"); then
                  if [ -n "$deleted" ] || grep -qE '^scripts/check-skills\.py$' <<< "$files"; then
                    enable documentation
                  fi
                else
                  enable documentation
                fi
              fi
            fi
          fi
          configuration=false
          for check in runtime composer yaml compose tooling; do
            if [ "${checks[$check]}" = "true" ]; then configuration=true; fi
          done
          echo "Code changes: $code"
          {
            for check in "${names[@]}"; do echo "$check=${checks[$check]}"; done
            echo "configuration=$configuration"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

  lint-configuration:
    name: Lint configuration
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.configuration == 'true' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap PHP project
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: ${{ (needs.changes.outputs.runtime == 'true' || needs.changes.outputs.composer == 'true' || needs.changes.outputs.yaml == 'true') && 'true' || 'false' }}
          print-versions: 'false'

      - name: Display Symfony application information
        if: ${{ needs.changes.outputs.runtime == 'true' }}
        run: bash scripts/make.sh application-info

      - name: Validate main `composer.json` and `composer.lock` files
        if: ${{ needs.changes.outputs.composer == 'true' }}
        run: bash scripts/make.sh composer-validate

      - name: Check that environment is configured correctly
        if: ${{ needs.changes.outputs.runtime == 'true' }}
        run: bash scripts/make.sh check-requirements

      - name: Lint YAML configurations
        if: ${{ needs.changes.outputs.yaml == 'true' }}
        run: bash scripts/make.sh lint-yaml

      - name: Test development tooling contracts
        if: ${{ needs.changes.outputs.tooling == 'true' }}
        run: |
          bash scripts/make.sh test-command-output
          docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php python3 scripts/tests/check-workflow-tool-updates-test.py

      - name: Validate Compose and Dev Container configurations
        if: ${{ needs.changes.outputs.compose == 'true' }}
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          docker compose -f compose.yaml -f docker/ci-compose.yaml config --quiet
          docker compose -f compose.yaml -f .devcontainer/docker-compose.devcontainer.yml config --quiet
          docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php python3 -m json.tool .devcontainer/devcontainer.json /dev/null

      - &stop_php_step
        name: Stop PHP development container
        if: ${{ always() }}
        run: bash scripts/make.sh ci-stop

  lint-documentation:
    name: Lint documentation files
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.documentation == 'true' }}
    timeout-minutes: 10

    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap development container
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'

      - name: Lint all markdown documentation files
        if: ${{ needs.changes.outputs.markdown == 'true' }}
        run: bash scripts/make.sh lint-markdown

      - name: Validate skill metadata, index coverage, and repository Markdown links
        run: bash scripts/make.sh check-skills

      - *stop_php_step

  lint-workflows:
    name: Validate GitHub workflows
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.workflows == 'true' }}
    timeout-minutes: 10
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap development container
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'

      - name: Validate workflows, embedded shell, and local action metadata
        run: bash scripts/make.sh lint-workflows

      - *stop_php_step

  security-check:
    name: PHP Security Checker
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (needs.changes.result == 'success' && needs.changes.outputs.security == 'true')) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap PHP project
        uses: ./.github/actions/php-bootstrap

      - name: PHP Security Checker
        uses: symfonycorp/security-checker-action@258311ef7ac571f1310780ef3d79fc5abef642b5 # v5

      - name: Check that application doesn't have installed dependencies with known security vulnerabilities
        run: bash scripts/make.sh check-security

      - *stop_php_step

  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    timeout-minutes: 5
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-image-verify-pins:
    name: Verify Docker base image pins (multi-platform)
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.images == 'true' }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - *harden_runner_step

      # Only Dockerfiles are needed, so use shallow checkout without credentials
      - name: Make checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '1'
          persist-credentials: false

      # Failures are reported as pull request annotations and job summary
      - name: Verify multi-platform base images
        run: bash scripts/make.sh docker-image-verify-pins

  docker-image-check-updates:
    name: Check Docker image versions
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (needs.changes.result == 'success' && needs.changes.outputs.images == 'true')) }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - *harden_runner_step

      - name: Make checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '1'
          persist-credentials: false

      - name: Bootstrap development container
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'

      - name: Run Docker image helper regression tests
        run: bash scripts/make.sh test-docker-images

      - name: Authenticate to Docker Hub when credentials are available
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'schedule' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          elif [ -n "$DOCKERHUB_USERNAME" ] || [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, or neither."
            exit 1
          else
            echo "::notice::Docker Hub credentials unavailable; using anonymous registry requests (rate limits apply)."
          fi

      - name: Check for newer stable Docker image versions
        run: bash scripts/docker-images.sh check-updates --advisory

      - name: Log out of Docker Hub
        if: ${{ always() }}
        run: docker logout docker.io

      - *stop_php_step

  lightweight-analyzers:
    name: Lightweight static analyzers
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.php == 'true' }}
    timeout-minutes: 10
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap PHP project
        id: bootstrap
        uses: ./.github/actions/php-bootstrap

      - name: Run PHP CodeSniffer
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh phpcs

      - name: Run ECS
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh ecs

      - name: Run PHPLint
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh phplint

      - name: Run PHP Parallel Lint
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh php-parallel-lint

      - name: Run PHPLoc
        id: phploc
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh phploc

      - name: Archive `phploc` results (phploc.json)
        if: ${{ !cancelled() && (steps.phploc.outcome == 'success' || steps.phploc.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phploc.json
          path: ./build/phploc.json
          if-no-files-found: error
          retention-days: 14

      - *stop_php_step

  static-analyzers:
    name: Static analyzers (${{ matrix.analyzer.name }})
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.php == 'true' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        analyzer:
          - name: Psalm
            command: bash scripts/make.sh psalm-github
          - name: PHPStan
            command: bash scripts/make.sh phpstan-github
          - name: PHP Insights
            command: bash scripts/make.sh phpinsights
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap PHP project
        uses: ./.github/actions/php-bootstrap

      - name: Run static analyzer (${{ matrix.analyzer.name }})
        run: ${{ matrix.analyzer.command }}

      - name: Archive Psalm results (psalm.json)
        if: ${{ !cancelled() && matrix.analyzer.name == 'Psalm' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psalm.json
          path: ./build/psalm.json
          if-no-files-found: error
          retention-days: 14

      - *stop_php_step

  ci-summary:
    name: Validate CI prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - docker-image-check-updates
      - docker-image-verify-pins
      - gitleaks
      - lint-configuration
      - lint-documentation
      - lint-workflows
      - security-check
      - lightweight-analyzers
      - static-analyzers
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    steps:
      - *harden_runner_step

      - name: Validate prerequisite job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          DOCUMENTATION_CHANGED: ${{ needs.changes.outputs.documentation }}
          CONFIGURATION_CHANGED: ${{ needs.changes.outputs.configuration }}
          WORKFLOWS_CHANGED: ${{ needs.changes.outputs.workflows }}
          SECURITY_CHANGED: ${{ needs.changes.outputs.security }}
          IMAGES_CHANGED: ${{ needs.changes.outputs.images }}
          PHP_CHANGED: ${{ needs.changes.outputs.php }}
          SECURITY_CHECK: ${{ needs.security-check.result }}
          LINT_CONFIGURATION: ${{ needs.lint-configuration.result }}
          LINT_DOCUMENTATION: ${{ needs.lint-documentation.result }}
          LINT_WORKFLOWS: ${{ needs.lint-workflows.result }}
          STATIC_ANALYZERS: ${{ needs.static-analyzers.result }}
          LIGHTWEIGHT_ANALYZERS: ${{ needs.lightweight-analyzers.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          DOCKER_PINS: ${{ needs.docker-image-verify-pins.result }}
          DOCKER_UPDATES: ${{ needs.docker-image-check-updates.result }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Change detection result: $CHANGES (code changed: $CODE_CHANGED)"
          echo "PHP Security Checker result: $SECURITY_CHECK"
          echo "Lint configuration result: $LINT_CONFIGURATION"
          echo "Lint documentation result: $LINT_DOCUMENTATION"
          echo "Workflow validation result: $LINT_WORKFLOWS"
          echo "Static analyzer matrix result: $STATIC_ANALYZERS"
          echo "Lightweight analyzer result: $LIGHTWEIGHT_ANALYZERS"
          echo "Gitleaks result: $GITLEAKS"
          echo "Docker base image pin verification result: $DOCKER_PINS"
          echo "Docker image version check result: $DOCKER_UPDATES"

          expect_selected() {
            case "$1" in
              true) test "$2" = "success" ;;
              false) test "$2" = "skipped" ;;
              *) echo "Invalid change detection output: $1"; return 1 ;;
            esac
          }
          if [ "$EVENT_NAME" = "schedule" ]; then
            test "$CHANGES" = "skipped"
            test "$SECURITY_CHECK" = "success"
            test "$DOCKER_UPDATES" = "success"
            test "$GITLEAKS" = "skipped"
            CONFIGURATION_CHANGED=false
            DOCUMENTATION_CHANGED=false
            WORKFLOWS_CHANGED=false
            PHP_CHANGED=false
            IMAGES_CHANGED=false
          else
            test "$CHANGES" = "success"
            expect_selected "$SECURITY_CHANGED" "$SECURITY_CHECK"
            expect_selected "$IMAGES_CHANGED" "$DOCKER_UPDATES"
            test "$GITLEAKS" = "success"
          fi
          expect_selected "$CONFIGURATION_CHANGED" "$LINT_CONFIGURATION"
          expect_selected "$DOCUMENTATION_CHANGED" "$LINT_DOCUMENTATION"
          expect_selected "$WORKFLOWS_CHANGED" "$LINT_WORKFLOWS"
          expect_selected "$PHP_CHANGED" "$STATIC_ANALYZERS"
          expect_selected "$PHP_CHANGED" "$LIGHTWEIGHT_ANALYZERS"
          expect_selected "$IMAGES_CHANGED" "$DOCKER_PINS"

  test:
    name: PHPUnit tests
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.tests == 'true' }}
    timeout-minutes: 20
    needs:
      - changes
    services:
      mariadb:
        image: mariadb:13.0.2@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
        env:
          MYSQL_ROOT_PASSWORD: symfony
          MYSQL_DATABASE: symfony
        ports:
          - 3306/tcp
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-start-period=30s --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap PHP project
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'
          cache-dependencies: 'true'

      - name: Configure application for CI run
        run: bash scripts/make.sh configure-ci

      - name: Install Composer dependencies
        run: bash scripts/make.sh install

      - name: Check which versions we're using
        run: bash scripts/make.sh tool-versions

      #- name: Prepare Code Climate (https://codeclimate.com/github/tarlepp/symfony-flex-backend/)
      #  run: |
      #    curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./cc-test-reporter
      #    chmod +x ./cc-test-reporter
      #    GIT_BRANCH=$GITHUB_REF GIT_COMMIT_SHA=$GITHUB_SHA ./cc-test-reporter before-build
      #  env:
      #    CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }} # https://docs.codeclimate.com/docs/finding-your-test-coverage-token

      - name: Run application test suites with PHPUnit
        id: phpunit
        run: bash scripts/make.sh run-tests-php
        env:
          DATABASE_URL: mysql://root:symfony@host.docker.internal:${{ job.services.mariadb.ports['3306'] }}/symfony

      - name: Create PhpMetrics report
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') && hashFiles('build/logs/junit.xml') != '' }}
        run: |
          test -s build/logs/junit.xml
          # Keep PHP variables literal for the PHP interpreter.
          # shellcheck disable=SC2016
          php -r '
            $report = simplexml_load_file("build/logs/junit.xml");
            if ($report === false || $report->getName() !== "testsuites" || !isset($report->testsuite)) {
                fwrite(STDERR, "JUnit report is not usable for PhpMetrics.\n");
                exit(1);
            }
          '
          bash scripts/make.sh phpmetrics

      - name: Verify required report files
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        run: |
          missing=0
          for report in build/logs/clover.xml build/logs/junit.xml build/report/index.html build/phpmetrics/index.html; do
            if [ ! -s "$report" ]; then
              echo "::error file=$report::Required report is missing or empty: $report"
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish test and coverage summary
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') && hashFiles('build/logs/junit.xml', 'build/logs/clover.xml') != '' }}
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          suite = ET.parse("build/logs/junit.xml").getroot()
          while suite.tag == "testsuites" and len(suite) == 1:
              suite = suite[0]
          totals = {k: 0 for k in ("tests", "assertions", "failures", "errors", "skipped")}
          for node in ([suite] if suite.tag == "testsuite" else list(suite)):
              for key in totals:
                  totals[key] += int(node.get(key, 0))

          metrics = ET.parse("build/logs/clover.xml").getroot().find("./project/metrics")
          print("### PHPUnit results")
          print()
          print("| Tests | Assertions | Failures | Errors | Skipped |")
          print("|---|---|---|---|---|")
          print("| " + " | ".join(str(totals[k]) for k in totals) + " |")
          if metrics is not None:
              statements = int(metrics.get("statements", 0))
              covered = int(metrics.get("coveredstatements", 0))
              if statements:
                  print()
                  print(f"Line coverage: **{covered / statements:.2%}** ({covered}/{statements} statements)")
          PY

      - name: Archive code coverage results (clover.xml)
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clover.xml
          path: ./build/logs/clover.xml
          if-no-files-found: error
          retention-days: 14

      - name: Archive code coverage results (junit.xml)
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit.xml
          path: ./build/logs/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Archive Code Coverage
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodeCoverage
          path: ./build/report
          if-no-files-found: error
          retention-days: 14

      - name: Archive PhpMetrics results
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhpMetrics
          path: ./build/phpmetrics
          if-no-files-found: error
          retention-days: 14

  report:
    name: External reporting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - ci-summary
      - test
    if: ${{ !cancelled() && needs.ci-summary.result == 'success' && needs.test.result == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    permissions:
      contents: read
    steps:
      - *harden_runner_step

      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: '0'
          persist-credentials: false

      - name: Download Clover coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clover.xml
          path: ./build/logs

      - name: Download JUnit test report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: junit.xml
          path: ./build/logs

      - name: Bootstrap PHP tools
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'
          cache-dependencies: 'true'

      - name: Install Coveralls reporter
        run: docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php composer install --working-dir=tools/06_php-coveralls --no-progress --optimize-autoloader

      - name: Report results to Coveralls (https://coveralls.io/github/tarlepp/symfony-flex-backend)
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        run: |
          docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T \
            --env GITHUB_TOKEN --env COVERALLS_REPO_TOKEN --env COVERALLS_RUN_LOCALLY \
            --env GITHUB_ACTIONS --env GITHUB_EVENT_NAME --env GITHUB_REF --env GITHUB_RUN_ID \
            php php ./tools/06_php-coveralls/vendor/bin/php-coveralls -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          COVERALLS_RUN_LOCALLY: 1

      - name: Prepare reports for host-side SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: bash scripts/make.sh prepare-sonar-reports
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Scan (https://sonarcloud.io/dashboard?id=github.com.tarlepp.symfony-flex-backend)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >-
            -Dsonar.php.coverage.reportPaths=build/sonar/clover.xml
            -Dsonar.php.tests.reportPath=build/sonar/junit.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - *stop_php_step

  docker-build:
    name: Build application Docker image (${{ matrix.target }})
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.docker == 'true' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [development, production]
    needs:
      - changes

    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Set tag var
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "DOCKER_TAG=$(echo "$REF_NAME" | sed -E 's#[/().]+#_#g')-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: ''

      - name: Build the Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: symfony-flex-backend:${{ steps.vars.outputs.DOCKER_TAG }}-${{ matrix.target }}
          cache-from: type=gha,version=2,scope=ci-image-${{ matrix.target }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && format('type=gha,version=2,scope=ci-image-{0},mode=max', matrix.target) || '' }}
          pull: true
          no-cache-filters: production

      - name: Scan Docker image with Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'symfony-flex-backend:${{ steps.vars.outputs.DOCKER_TAG }}-${{ matrix.target }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  ci-result:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && 'Metadata-only PR edit (no validation)' || 'Validate CI result' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - ci-summary
      - lightweight-analyzers
      - static-analyzers
      - test
      - docker-build
      - report
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    steps:
      - *harden_runner_step

      - name: Validate final job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          PHP_CHANGED: ${{ needs.changes.outputs.php }}
          TESTS_CHANGED: ${{ needs.changes.outputs.tests }}
          DOCKER_CHANGED: ${{ needs.changes.outputs.docker }}
          CI_SUMMARY: ${{ needs.ci-summary.result }}
          STATIC_ANALYZERS: ${{ needs.static-analyzers.result }}
          LIGHTWEIGHT_ANALYZERS: ${{ needs.lightweight-analyzers.result }}
          TEST: ${{ needs.test.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          REPORT: ${{ needs.report.result }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Change detection result: $CHANGES (code changed: $CODE_CHANGED)"
          echo "Prerequisite gate result: $CI_SUMMARY"
          echo "Static analyzer matrix result: $STATIC_ANALYZERS"
          echo "Lightweight analyzer result: $LIGHTWEIGHT_ANALYZERS"
          echo "PHPUnit result: $TEST"
          echo "Docker build matrix result: $DOCKER_BUILD"
          echo "External reporting result: $REPORT"

          expect_selected() {
            case "$1" in
              true) test "$2" = "success" ;;
              false) test "$2" = "skipped" ;;
              *) echo "Invalid change detection output: $1"; return 1 ;;
            esac
          }
          if [ "$EVENT_NAME" = "schedule" ]; then
            test "$CHANGES" = "skipped"
            PHP_CHANGED=false
            TESTS_CHANGED=false
            DOCKER_CHANGED=false
          else
            test "$CHANGES" = "success"
          fi

          report_expected=skipped
          if [ "$TESTS_CHANGED" = "true" ] && {
            [ "$EVENT_NAME" = "pull_request" ] ||
            { [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/master" ]; }
          }; then
            report_expected=success
          fi

          test "$CI_SUMMARY" = "success"
          expect_selected "$PHP_CHANGED" "$STATIC_ANALYZERS"
          expect_selected "$PHP_CHANGED" "$LIGHTWEIGHT_ANALYZERS"
          expect_selected "$TESTS_CHANGED" "$TEST"
          expect_selected "$DOCKER_CHANGED" "$DOCKER_BUILD"
          test "$REPORT" = "$report_expected"
