# GitHub Actions docs
# https://help.github.com/en/articles/about-github-actions
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
name: CI
on:
  # Validate master pushes, pull requests targeting any branch, merge groups,
  # and manual runs. Scheduled runs select only the periodic checks below.
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
    types:
      - checks_requested
  schedule:
    # Periodic checks only: dependency advisories and Docker image updates.
    # Production and development image scans run in vulnerability-scan.yml.
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' }}
    timeout-minutes: 5
    outputs:
      markdown: ${{ steps.detect.outputs.markdown }}
      documentation: ${{ steps.detect.outputs.documentation }}
      configuration: ${{ steps.detect.outputs.configuration }}
      runtime: ${{ steps.detect.outputs.runtime }}
      composer: ${{ steps.detect.outputs.composer }}
      yaml: ${{ steps.detect.outputs.yaml }}
      compose: ${{ steps.detect.outputs.compose }}
      tooling: ${{ steps.detect.outputs.tooling }}
      workflows: ${{ steps.detect.outputs.workflows }}
      security: ${{ steps.detect.outputs.security }}
      images: ${{ steps.detect.outputs.images }}
      php: ${{ steps.detect.outputs.php }}
      tests: ${{ steps.detect.outputs.tests }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - &harden_runner_step
        name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - &checkout_full_history_step
        name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false

      - name: Detect affected validation
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash scripts/ci-detect-changes.sh

  lint-configuration:
    name: Lint configuration
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.configuration == 'true' }}
    timeout-minutes: 10
    steps:
      - *harden_runner_step

      - &checkout_step
        name: Check out repository with shallow history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '1'
          persist-credentials: false

      - name: Bootstrap PHP project
        id: bootstrap
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: ${{ (needs.changes.outputs.runtime == 'true' || needs.changes.outputs.composer == 'true' || needs.changes.outputs.yaml == 'true') && 'true' || 'false' }}
          print-versions: 'false'

      - name: Display Symfony application information
        id: application-info
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && needs.changes.outputs.runtime == 'true' }}
        run: bash scripts/make.sh application-info

      - name: Validate main `composer.json` and `composer.lock` files
        id: composer
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && needs.changes.outputs.composer == 'true' }}
        run: bash scripts/make.sh composer-validate

      - name: Check application runtime requirements
        id: requirements
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && needs.changes.outputs.runtime == 'true' }}
        run: bash scripts/make.sh check-requirements

      - name: Lint Symfony YAML configuration
        id: yaml
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && needs.changes.outputs.yaml == 'true' }}
        run: bash scripts/make.sh lint-yaml

      - name: Test development tooling contracts
        id: tooling
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && needs.changes.outputs.tooling == 'true' }}
        run: |
          bash scripts/make.sh test-command-output
          docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php python3 scripts/tests/check-workflow-tool-updates-test.py

      - name: Validate Compose and Dev Container configurations
        id: compose
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && needs.changes.outputs.compose == 'true' }}
        run: bash scripts/ci-validate-compose.sh

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Configuration validation
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          INFO: ${{ steps.application-info.outcome || 'skipped' }}
          COMPOSER: ${{ steps.composer.outcome || 'skipped' }}
          REQUIREMENTS: ${{ steps.requirements.outcome || 'skipped' }}
          YAML: ${{ steps.yaml.outcome || 'skipped' }}
          TOOLING: ${{ steps.tooling.outcome || 'skipped' }}
          COMPOSE: ${{ steps.compose.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'Checks are selected by changed paths; see step logs for details.' \
            'Bootstrap' "$BOOTSTRAP" 'Application information' "$INFO" \
            'Composer validation' "$COMPOSER" 'Runtime requirements' "$REQUIREMENTS" \
            'Symfony YAML' "$YAML" 'Tooling contracts' "$TOOLING" \
            'Compose and Dev Container' "$COMPOSE" >> "$GITHUB_STEP_SUMMARY"

      - &failure_diagnostics_step
        name: Diagnose PHP container failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash scripts/ci-failure-diagnostics.sh

      - &stop_php_step
        name: Stop PHP development container
        if: ${{ always() }}
        run: bash scripts/make.sh ci-stop

  lint-documentation:
    name: Lint documentation files
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.documentation == 'true' }}
    timeout-minutes: 10

    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap development container
        id: bootstrap
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'

      - name: Lint all markdown documentation files
        id: markdown
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && needs.changes.outputs.markdown == 'true' }}
        run: bash scripts/make.sh lint-markdown

      - name: Validate skill metadata, index coverage, and repository Markdown links
        id: documentation
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh check-skills

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Documentation validation
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          MARKDOWN: ${{ steps.markdown.outcome || 'skipped' }}
          DOCUMENTATION: ${{ steps.documentation.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'Markdown lint is selected by changed paths; see step logs for details.' \
            'Bootstrap' "$BOOTSTRAP" 'Markdown lint' "$MARKDOWN" \
            'Metadata and links' "$DOCUMENTATION" >> "$GITHUB_STEP_SUMMARY"

      - *failure_diagnostics_step
      - *stop_php_step

  lint-workflows:
    name: Validate GitHub workflows
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.workflows == 'true' }}
    timeout-minutes: 10
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Cache verified workflow validator downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/workflow-validators
          key: workflow-validators-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lint-workflows.sh') }}

      - name: Bootstrap development container
        id: bootstrap
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'

      - name: Validate workflows, embedded shell, and local action metadata
        id: validation
        run: bash scripts/make.sh lint-workflows

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Workflow validation
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          VALIDATION: ${{ steps.validation.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'See the validation step log for errors and supported checks.' \
            'Bootstrap' "$BOOTSTRAP" 'Workflow and action validation' "$VALIDATION" >> "$GITHUB_STEP_SUMMARY"

      - *failure_diagnostics_step
      - *stop_php_step

  security-check:
    name: PHP Security Checker
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (needs.changes.result == 'success' && needs.changes.outputs.security == 'true')) }}
    timeout-minutes: 10
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap PHP project
        id: bootstrap
        uses: ./.github/actions/php-bootstrap

      - name: PHP Security Checker
        id: symfony-security
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        uses: symfonycorp/security-checker-action@258311ef7ac571f1310780ef3d79fc5abef642b5 # v5

      - name: Check installed dependencies for known vulnerabilities
        id: dependency-security
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh check-security

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Dependency security
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          SYMFONY_SECURITY: ${{ steps.symfony-security.outcome || 'skipped' }}
          DEPENDENCY_SECURITY: ${{ steps.dependency-security.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'See the security check logs for advisories and failure details.' \
            'Bootstrap' "$BOOTSTRAP" 'Symfony security checker' "$SYMFONY_SECURITY" \
            'Installed dependency audit' "$DEPENDENCY_SECURITY" >> "$GITHUB_STEP_SUMMARY"

      - *failure_diagnostics_step
      - *stop_php_step

  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' }}
    timeout-minutes: 5
    steps:
      - *harden_runner_step

      - *checkout_full_history_step

      - name: Gitleaks scan
        id: scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Secret scanning
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          SCAN: ${{ steps.scan.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'See the Gitleaks step log and annotations for findings.' \
            'Gitleaks scan' "$SCAN" >> "$GITHUB_STEP_SUMMARY"

  docker-image-verify-pins:
    name: Verify Docker base image pins (multi-platform)
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.images == 'true' }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - *harden_runner_step

      # Pin verification needs repository files and scripts, not Git history.
      - name: Check out repository with shallow history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '1'
          persist-credentials: false

      # Failures are reported as pull request annotations and job summary
      - name: Verify multi-platform base images
        id: verify
        run: bash scripts/make.sh docker-image-verify-pins

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Docker base image pins
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          VERIFY: ${{ steps.verify.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'See the verification log and annotations for image pin details.' \
            'Multi-platform pin verification' "$VERIFY" >> "$GITHUB_STEP_SUMMARY"

  docker-image-check-updates:
    name: Check Docker image versions
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (needs.changes.result == 'success' && needs.changes.outputs.images == 'true')) }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - *harden_runner_step

      - name: Check out repository with shallow history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '1'
          persist-credentials: false

      - name: Authenticate to Docker Hub when credentials are available
        id: authentication
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'schedule' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          elif [ -n "$DOCKERHUB_USERNAME" ] || [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, or neither."
            exit 1
          else
            echo "::notice::Docker Hub credentials unavailable; using anonymous registry requests (rate limits apply)."
          fi

      - name: Bootstrap maintenance container
        id: bootstrap
        uses: ./.github/actions/php-bootstrap
        with:
          build-target: maintenance
          install-dependencies: 'false'
          print-versions: 'false'
          cache-dependencies: 'false'

      - name: Run Docker image helper regression tests
        id: tests
        run: bash scripts/make.sh test-docker-images

      - name: Check for newer stable Docker image versions
        id: updates
        run: bash scripts/docker-images.sh check-updates --advisory

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Docker image updates
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          AUTHENTICATION: ${{ steps.authentication.outcome || 'skipped' }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          TESTS: ${{ steps.tests.outcome || 'skipped' }}
          UPDATES: ${{ steps.updates.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'Version updates are advisory; see the update check log for candidates.' \
            'Docker Hub credential check' "$AUTHENTICATION" 'Bootstrap' "$BOOTSTRAP" \
            'Helper regression tests' "$TESTS" 'Image version check' "$UPDATES" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Docker Hub
        if: ${{ always() }}
        run: docker logout docker.io

      - *failure_diagnostics_step
      - *stop_php_step

  statistics:
    name: Project statistics
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' }}
    timeout-minutes: 15
    steps:
      - *harden_runner_step

      - *checkout_full_history_step

      - name: Bootstrap PHP project
        id: bootstrap
        continue-on-error: true
        uses: ./.github/actions/php-bootstrap
        with:
          print-versions: 'false'

      - name: Summarize selected tool versions
        id: versions
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          COLOR: never
          NO_COLOR: '1'
          NATIVE_COLOR: never
        run: |
          bash scripts/make.sh tool-versions | tee "$RUNNER_TEMP/tool-versions.txt"
          bash scripts/ci-statistics-summary.sh versions 'Tool versions' "$RUNNER_TEMP/tool-versions.txt"

      - name: Summarize project files
        id: project
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        run: bash scripts/ci-statistics-summary.sh run 'Project file statistics' bash scripts/make.sh project-stats

      - name: Summarize PR changes by area
        id: pr-changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci-statistics-summary.sh run 'PR changes by area' \
            docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php \
            python3 scripts/project-stats.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Summarize dependency licenses
        id: licenses
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        run: bash scripts/ci-statistics-summary.sh run 'Dependency licenses' bash scripts/make.sh check-licenses

      - name: Summarize Docker builder platforms
        id: platforms
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/ci-statistics-summary.sh run 'Docker builder platforms' bash scripts/make.sh docker-builder-platforms

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Project statistics collection
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          VERSIONS: ${{ steps.versions.outcome || 'skipped' }}
          PROJECT: ${{ steps.project.outcome || 'skipped' }}
          PR_CHANGES: ${{ steps.pr-changes.outcome || 'skipped' }}
          LICENSES: ${{ steps.licenses.outcome || 'skipped' }}
          PLATFORMS: ${{ steps.platforms.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'Informational only; failures do not block the merge gate. See step logs for diagnostics.' \
            'Bootstrap' "$BOOTSTRAP" 'Tool versions' "$VERSIONS" 'Project files' "$PROJECT" \
            'PR changes' "$PR_CHANGES" \
            'Dependency licenses' "$LICENSES" 'Docker builder platforms' "$PLATFORMS" >> "$GITHUB_STEP_SUMMARY"

      - *failure_diagnostics_step
      - *stop_php_step

  lightweight-analyzers:
    name: Lightweight static analyzers
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.php == 'true' }}
    timeout-minutes: 10
    steps:
      - *harden_runner_step

      - *checkout_full_history_step

      - name: Bootstrap PHP project
        id: bootstrap
        uses: ./.github/actions/php-bootstrap

      - name: Run PHP CodeSniffer
        id: phpcs
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh phpcs

      - name: Run ECS
        id: ecs
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh ecs

      - name: Run PHPLint
        id: phplint
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh phplint

      - name: Run PHP Parallel Lint
        id: parallel-lint
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh php-parallel-lint

      - name: Run PHPLoc
        id: phploc
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        shell: bash
        env:
          COLOR: never
          NO_COLOR: '1'
          NATIVE_COLOR: never
        run: bash scripts/make.sh phploc | tee "$RUNNER_TEMP/phploc-output.txt"

      - name: Publish PHPLoc statistics
        if: ${{ !cancelled() && (steps.phploc.outcome == 'success' || steps.phploc.outcome == 'failure') }}
        continue-on-error: true
        run: bash scripts/ci-statistics-summary.sh file 'PHPLoc statistics' "$RUNNER_TEMP/phploc-output.txt"

      - name: Archive `phploc` results (phploc.json)
        id: artifact
        if: ${{ !cancelled() && (steps.phploc.outcome == 'success' || steps.phploc.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phploc.json
          path: ./build/phploc.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Lightweight static analyzers
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          PHPCS: ${{ steps.phpcs.outcome || 'skipped' }}
          ECS: ${{ steps.ecs.outcome || 'skipped' }}
          PHPLINT: ${{ steps.phplint.outcome || 'skipped' }}
          PARALLEL_LINT: ${{ steps.parallel-lint.outcome || 'skipped' }}
          PHPLOC: ${{ steps.phploc.outcome || 'skipped' }}
          ARTIFACT: ${{ steps.artifact.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'See step logs for findings; phploc.json is available as an artifact when uploaded.' \
            'Bootstrap' "$BOOTSTRAP" 'PHP CodeSniffer' "$PHPCS" 'ECS' "$ECS" \
            'PHPLint' "$PHPLINT" 'PHP Parallel Lint' "$PARALLEL_LINT" \
            'PHPLoc' "$PHPLOC" 'PHPLoc artifact' "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"

      - *failure_diagnostics_step
      - *stop_php_step

  static-analyzers:
    name: Static analyzers (${{ matrix.analyzer.name }})
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.php == 'true' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        analyzer:
          - name: Psalm
            target: psalm-github
          - name: PHPStan
            target: phpstan-github
          - name: PHP Insights
            target: phpinsights
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap PHP project
        id: bootstrap
        uses: ./.github/actions/php-bootstrap

      - name: Run static analyzer (${{ matrix.analyzer.name }})
        id: analyzer
        shell: bash
        env:
          ANALYZER_TARGET: ${{ matrix.analyzer.target }}
        run: |
          if [ "$ANALYZER_TARGET" = phpinsights ]; then
            COLOR=never NO_COLOR=1 NATIVE_COLOR=never bash scripts/make.sh "$ANALYZER_TARGET" | tee "$RUNNER_TEMP/phpinsights-output.txt"
          else
            bash scripts/make.sh "$ANALYZER_TARGET"
          fi

      - name: Publish PHP Insights scores
        if: ${{ !cancelled() && matrix.analyzer.name == 'PHP Insights' && (steps.analyzer.outcome == 'success' || steps.analyzer.outcome == 'failure') }}
        continue-on-error: true
        run: bash scripts/ci-statistics-summary.sh insights 'PHP Insights scores' "$RUNNER_TEMP/phpinsights-output.txt"

      - name: Archive Psalm results (psalm.json)
        id: artifact
        if: ${{ !cancelled() && matrix.analyzer.name == 'Psalm' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psalm.json
          path: ./build/psalm.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Static analyzer
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          ANALYZER: ${{ matrix.analyzer.name }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          ANALYSIS: ${{ steps.analyzer.outcome || 'skipped' }}
          ARTIFACT: ${{ steps.artifact.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'See the analyzer log and annotations for findings; only Psalm uploads a JSON artifact.' \
            'Analyzer' "$ANALYZER" 'Bootstrap' "$BOOTSTRAP" \
            'Analysis' "$ANALYSIS" 'Psalm artifact' "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"

      - *failure_diagnostics_step
      - *stop_php_step

  ci-summary:
    name: Validate CI prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - docker-image-check-updates
      - docker-image-verify-pins
      - gitleaks
      - lint-configuration
      - lint-documentation
      - lint-workflows
      - security-check
      - lightweight-analyzers
      - static-analyzers
    if: ${{ !cancelled() }}
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Validate prerequisite job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          DOCUMENTATION_CHANGED: ${{ needs.changes.outputs.documentation }}
          CONFIGURATION_CHANGED: ${{ needs.changes.outputs.configuration }}
          WORKFLOWS_CHANGED: ${{ needs.changes.outputs.workflows }}
          SECURITY_CHANGED: ${{ needs.changes.outputs.security }}
          IMAGES_CHANGED: ${{ needs.changes.outputs.images }}
          PHP_CHANGED: ${{ needs.changes.outputs.php }}
          SECURITY_CHECK: ${{ needs.security-check.result }}
          LINT_CONFIGURATION: ${{ needs.lint-configuration.result }}
          LINT_DOCUMENTATION: ${{ needs.lint-documentation.result }}
          LINT_WORKFLOWS: ${{ needs.lint-workflows.result }}
          STATIC_ANALYZERS: ${{ needs.static-analyzers.result }}
          LIGHTWEIGHT_ANALYZERS: ${{ needs.lightweight-analyzers.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          DOCKER_PINS: ${{ needs.docker-image-verify-pins.result }}
          DOCKER_UPDATES: ${{ needs.docker-image-check-updates.result }}
        run: bash scripts/ci-prerequisite-gate.sh

  test:
    name: PHPUnit tests
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.tests == 'true' }}
    timeout-minutes: 20
    needs:
      - changes
    services:
      mariadb:
        image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
        env:
          MYSQL_ROOT_PASSWORD: symfony
          MYSQL_DATABASE: symfony
        ports:
          - 3306/tcp
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-start-period=30s --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Bootstrap PHP project
        id: bootstrap
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'
          cache-dependencies: 'true'

      - name: Configure application for CI run
        id: configure
        run: bash scripts/make.sh configure-ci

      - name: Install Composer dependencies
        id: install
        run: bash scripts/make.sh install

      - name: Display PHP, Composer, Symfony, and PHPUnit versions
        run: bash scripts/make.sh tool-versions

      - name: Run application test suites with PHPUnit
        id: phpunit
        run: bash scripts/make.sh run-tests-php
        env:
          DATABASE_URL: mysql://root:symfony@host.docker.internal:${{ job.services.mariadb.ports['3306'] }}/symfony

      - name: Create PhpMetrics report
        id: metrics
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') && hashFiles('build/logs/junit.xml') != '' }}
        shell: bash
        env:
          COLOR: never
          NO_COLOR: '1'
          NATIVE_COLOR: never
        run: |
          docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php python3 scripts/ci-test-reports.py validate-junit
          bash scripts/make.sh phpmetrics | tee "$RUNNER_TEMP/phpmetrics-output.txt"

      - name: Publish PhpMetrics statistics
        if: ${{ !cancelled() && (steps.metrics.outcome == 'success' || steps.metrics.outcome == 'failure') }}
        continue-on-error: true
        run: bash scripts/ci-statistics-summary.sh file 'PhpMetrics statistics' "$RUNNER_TEMP/phpmetrics-output.txt"

      - name: Verify required report files
        id: verify-reports
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        run: docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php python3 scripts/ci-test-reports.py verify

      - name: Publish test and coverage summary
        id: coverage-summary
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') && hashFiles('build/logs/junit.xml', 'build/logs/clover.xml') != '' }}
        continue-on-error: true
        run: docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php python3 scripts/ci-test-reports.py summary >> "$GITHUB_STEP_SUMMARY"

      - name: Archive code coverage results (clover.xml)
        id: clover
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clover.xml
          path: ./build/logs/clover.xml
          if-no-files-found: error
          retention-days: 14

      - name: Archive JUnit test results (junit.xml)
        id: junit
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit.xml
          path: ./build/logs/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Archive HTML code coverage report
        id: coverage
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodeCoverage
          path: ./build/report
          if-no-files-found: error
          retention-days: 14

      - name: Archive PhpMetrics results
        id: metrics-artifact
        if: ${{ !cancelled() && (steps.phpunit.outcome == 'success' || steps.phpunit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhpMetrics
          path: ./build/phpmetrics
          if-no-files-found: error
          retention-days: 14

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: PHPUnit and reports
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          CONFIGURE: ${{ steps.configure.outcome || 'skipped' }}
          INSTALL: ${{ steps.install.outcome || 'skipped' }}
          PHPUNIT: ${{ steps.phpunit.outcome || 'skipped' }}
          METRICS: ${{ steps.metrics.outcome || 'skipped' }}
          VERIFY: ${{ steps.verify-reports.outcome || 'skipped' }}
          SUMMARY: ${{ steps.coverage-summary.outcome || 'skipped' }}
          CLOVER: ${{ steps.clover.outcome || 'skipped' }}
          JUNIT: ${{ steps.junit.outcome || 'skipped' }}
          COVERAGE: ${{ steps.coverage.outcome || 'skipped' }}
          METRICS_ARTIFACT: ${{ steps.metrics-artifact.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'Test totals and coverage appear separately when reports are available; see logs and artifacts for details.' \
            'Bootstrap' "$BOOTSTRAP" 'CI configuration' "$CONFIGURE" \
            'Dependency installation' "$INSTALL" 'PHPUnit' "$PHPUNIT" \
            'PhpMetrics report' "$METRICS" 'Report verification' "$VERIFY" \
            'Test and coverage summary' "$SUMMARY" 'Clover artifact' "$CLOVER" \
            'JUnit artifact' "$JUNIT" 'HTML coverage artifact' "$COVERAGE" \
            'PhpMetrics artifact' "$METRICS_ARTIFACT" >> "$GITHUB_STEP_SUMMARY"

      - *failure_diagnostics_step
      - *stop_php_step

  report:
    name: External reporting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - ci-summary
      - test
    if: ${{ !cancelled() && needs.ci-summary.result == 'success' && needs.test.result == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    permissions:
      contents: read
    steps:
      - *harden_runner_step

      - name: Select external reporting
        id: reporting
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$COVERALLS_REPO_TOKEN" || -n "$SONAR_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "External reporting skipped: neither upload token is available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout tested source
        id: checkout-report
        if: ${{ steps.reporting.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: '0'
          persist-credentials: false

      - name: Download Clover coverage report
        id: clover
        if: ${{ steps.reporting.outputs.enabled == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clover.xml
          path: ./build/logs

      - name: Download JUnit test report
        id: junit
        if: ${{ steps.reporting.outputs.enabled == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: junit.xml
          path: ./build/logs

      - name: Bootstrap PHP tools
        id: bootstrap
        if: ${{ steps.reporting.outputs.enabled == 'true' }}
        uses: ./.github/actions/php-bootstrap
        with:
          install-dependencies: 'false'
          print-versions: 'false'
          cache-dependencies: 'true'

      - name: Install Coveralls reporter
        id: install-coveralls
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T php composer install --working-dir=tools/06_php-coveralls --no-progress --optimize-autoloader

      - name: Report results to Coveralls (https://coveralls.io/github/tarlepp/symfony-flex-backend)
        id: coveralls
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        run: |
          docker compose -f compose.yaml -f docker/ci-compose.yaml exec -T \
            --env GITHUB_TOKEN --env COVERALLS_REPO_TOKEN --env COVERALLS_RUN_LOCALLY \
            --env GITHUB_ACTIONS --env GITHUB_EVENT_NAME --env GITHUB_REF --env GITHUB_RUN_ID \
            php php ./tools/06_php-coveralls/vendor/bin/php-coveralls -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          COVERALLS_RUN_LOCALLY: 1

      - name: Prepare reports for host-side SonarQube scan
        id: prepare-sonar
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' && steps.checkout-report.outcome == 'success' && steps.clover.outcome == 'success' && steps.junit.outcome == 'success' && steps.bootstrap.outcome == 'success' }}
        run: bash scripts/make.sh prepare-sonar-reports
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Scan (https://sonarcloud.io/dashboard?id=github.com.tarlepp.symfony-flex-backend)
        id: sonar
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' && steps.prepare-sonar.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >-
            -Dsonar.php.coverage.reportPaths=build/sonar/clover.xml
            -Dsonar.php.tests.reportPath=build/sonar/junit.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publish job overview
        if: ${{ !cancelled() && steps.checkout-report.outcome == 'success' }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: External reporting
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          REPORTING: ${{ steps.reporting.outcome || 'skipped' }}
          CLOVER: ${{ steps.clover.outcome || 'skipped' }}
          JUNIT: ${{ steps.junit.outcome || 'skipped' }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome || 'skipped' }}
          INSTALL: ${{ steps.install-coveralls.outcome || 'skipped' }}
          COVERALLS: ${{ steps.coveralls.outcome || 'skipped' }}
          PREPARE: ${{ steps.prepare-sonar.outcome || 'skipped' }}
          SONAR: ${{ steps.sonar.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'Uploads require their respective tokens; see step logs for reporting details.' \
            'Reporting selection' "$REPORTING" 'Clover download' "$CLOVER" \
            'JUnit download' "$JUNIT" 'Bootstrap' "$BOOTSTRAP" \
            'Coveralls installation' "$INSTALL" 'Coveralls upload' "$COVERALLS" \
            'Sonar report preparation' "$PREPARE" 'SonarQube scan' "$SONAR" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose PHP container failure
        if: ${{ failure() && steps.bootstrap.outcome != 'skipped' }}
        timeout-minutes: 2
        run: bash scripts/ci-failure-diagnostics.sh

      - name: Stop PHP development container
        if: ${{ always() && steps.bootstrap.outcome != 'skipped' }}
        run: bash scripts/make.sh ci-stop

  docker-build:
    name: Build application Docker image (${{ matrix.target }})
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.docker == 'true' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [development, production]
    needs:
      - changes

    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: ''

      - name: Build the Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          outputs: type=docker,dest=${{ runner.temp }}/docker-image.tar
          push: false
          tags: symfony-flex-backend:ci-${{ github.sha }}-${{ matrix.target }}
          cache-from: type=gha,version=2,scope=ci-image-${{ matrix.target }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && format('type=gha,version=2,scope=ci-image-{0},mode=max', matrix.target) || '' }}
          pull: true
          no-cache-filters: production

      - name: Upload Docker image for scanning
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image-${{ matrix.target }}
          path: ${{ runner.temp }}/docker-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Docker image build
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          TARGET: ${{ matrix.target }}
          BUILDX: ${{ steps.buildx.outcome || 'skipped' }}
          BUILD: ${{ steps.build.outcome || 'skipped' }}
          ARTIFACT: ${{ steps.artifact.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'The image artifact is retained for one day for the Trivy scan; Docker Build supplies its own build details.' \
            'Buildx setup' "$BUILDX" 'Image build' "$BUILD" \
            'Image artifact upload' "$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"

  docker-scan:
    name: Scan application Docker image with Trivy (${{ matrix.target }})
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.result == 'success' && needs.changes.outputs.docker == 'true' && (needs.docker-build.result == 'success' || needs.docker-build.result == 'failure') }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: [development, production]
    needs:
      - changes
      - docker-build

    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Download Docker image for scanning
        id: image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image-${{ matrix.target }}
          path: ${{ runner.temp }}/docker-image

      - name: Scan Docker image with Trivy vulnerability scanner
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/docker-image/docker-image.tar
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate PR image scan SARIF
        id: sarif
        if: ${{ !cancelled() && steps.image.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/docker-image/docker-image.tar
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'

      - name: Upload PR image scan SARIF
        id: upload
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}

      - name: Publish job overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OVERVIEW_TITLE: Docker image vulnerability scan
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ steps.image.outcome || 'skipped' }}
          SCAN: ${{ steps.scan.outcome || 'skipped' }}
          SARIF: ${{ steps.sarif.outcome || 'skipped' }}
          UPLOAD: ${{ steps.upload.outcome || 'skipped' }}
        run: |
          bash scripts/ci-workflow-overview.sh \
            'The blocking scan checks fixable HIGH and CRITICAL OS and library vulnerabilities. SARIF is published for same-repository PRs only; see scan logs for findings.' \
            'Image artifact download' "$IMAGE" 'Blocking Trivy scan' "$SCAN" \
            'PR SARIF generation' "$SARIF" 'Code scanning upload' "$UPLOAD" >> "$GITHUB_STEP_SUMMARY"

  ci-result:
    name: Validate CI result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - ci-summary
      - lightweight-analyzers
      - static-analyzers
      - test
      - docker-build
      - docker-scan
      - report
    if: ${{ !cancelled() }}
    steps:
      - *harden_runner_step

      - *checkout_step

      - name: Validate final job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHANGES: ${{ needs.changes.result }}
          PHP_CHANGED: ${{ needs.changes.outputs.php }}
          TESTS_CHANGED: ${{ needs.changes.outputs.tests }}
          DOCKER_CHANGED: ${{ needs.changes.outputs.docker }}
          CI_SUMMARY: ${{ needs.ci-summary.result }}
          STATIC_ANALYZERS: ${{ needs.static-analyzers.result }}
          LIGHTWEIGHT_ANALYZERS: ${{ needs.lightweight-analyzers.result }}
          TEST: ${{ needs.test.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          DOCKER_SCAN: ${{ needs.docker-scan.result }}
          REPORT: ${{ needs.report.result }}
        run: bash scripts/ci-result-gate.sh
