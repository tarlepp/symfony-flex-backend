# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Dependency Review'
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Publish workflow run overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          REVIEW: ${{ steps.review.outcome || 'skipped' }}
        run: |
          {
            echo "## Workflow run overview"
            printf '\nEvent: %s · Prior steps: **%s**\n\n' "$EVENT_NAME" "$PRIOR_STATUS"
            echo '| Check | Result |'
            echo '| --- | --- |'
            printf '| Dependency review | %s |\n' "$REVIEW"
            echo
            echo 'See the dependency review step log for findings and failure details.'
          } >> "$GITHUB_STEP_SUMMARY"
