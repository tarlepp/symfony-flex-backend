# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Dependency Review'
        id: review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

      - name: Publish workflow run overview
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_STATUS: ${{ job.status }}
          REVIEW: ${{ steps.review.outcome || 'skipped' }}
        run: |
          bash scripts/ci/ci-workflow-overview.sh \
            'See the dependency review step log for findings and failure details.' \
            'Dependency review' "$REVIEW" >> "$GITHUB_STEP_SUMMARY"
