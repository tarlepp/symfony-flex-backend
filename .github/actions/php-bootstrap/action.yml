name: PHP bootstrap
description: Start the Compose development container, restore Composer cache, and optionally install dependencies and print versions
inputs:
  install-dependencies:
    description: Whether to run make install
    required: false
    default: 'true'
  print-versions:
    description: Whether to print PHP project tool versions
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set Composer cache location
      shell: bash
      # The value is a runner-controlled path, not attacker input.
      run: echo "COMPOSER_CACHE_DIR=$RUNNER_TEMP/composer-cache" >> "$GITHUB_ENV" # zizmor: ignore[github-env]

    - name: Cache Composer downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/composer-cache
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Start PHP development container
      shell: bash
      run: make ci-start

    - name: Install Composer dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: make install

    - name: Check which versions we are using
      if: ${{ inputs.print-versions == 'true' }}
      shell: bash
      run: make tool-versions
