services:
    php:
        entrypoint: []
        command: ["sleep", "infinity"]
        environment:
            XDEBUG_MODE: coverage
        volumes:
            - ${COMPOSER_CACHE_DIR:-/tmp/symfony-backend-composer-cache}:/home/dev/.cache/composer
            - ./docker/php/php-ci.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro
